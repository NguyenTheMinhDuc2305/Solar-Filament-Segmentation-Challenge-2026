[project]
name = "solar-filament-segmentation-2026"
version = "0.1.0"
description = "Continuous five-agent loop competing in the Solar Filament Segmentation Challenge 2026"
readme = "CLAUDE.md"
# Kaggle's GPU image runs Python 3.11. Pinning the local env to the same minor
# version is the point of this file: a smoke test that passes here should fail
# for real reasons, not because the local interpreter differs from the one the
# kernel will use.
requires-python = ">=3.11,<3.12"

dependencies = [
    # Orchestration + Kaggle control plane. These run on every teammate's laptop.
    "kaggle==2.2.4",
    "pyyaml==6.0.3",

    # Data, metric and post-processing. src/metric.py is the loop's decision
    # signal, so these are not optional even though no training happens locally.
    "numpy==2.4.2",
    "pandas==2.3.3",
    "pycocotools==2.0.11",
    "opencv-python-headless==4.11.0.86",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
]

[project.optional-dependencies]
# CPU-only Torch, for the implement agent's local smoke test. Never used to
# train: this machine has no CUDA GPU and training belongs on Kaggle.
smoke = [
    "torch==2.6.0",
    "albumentations==1.4.21",
    "segmentation-models-pytorch==0.4.0",
    # albumentations -> albucore -> stringzilla; 5.1.2 ships no win_amd64/cp311
    # wheel and fails to build without the MSVC toolchain. Pinned only for the
    # local smoke extra - requirements-kaggle.txt is unaffected and resolves
    # its own (Linux) wheel independently.
    "stringzilla==5.1.1",
]

[tool.uv]
# Keep the heavy CPU wheels out of the default sync; `uv sync --extra smoke`
# pulls them when the implement agent needs to run the smoke test.
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
